services:
  # ============================================================================
  # Backend API Server (Express.js + Node 22 LTS)
  # Connects directly to MongoDB Atlas via backend/.env
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifevault-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 5000
      NODE_ENV: production
    networks:
      - lifevault-net

  # ============================================================================
  # Frontend Client (React 18 + Vite + Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: lifevault-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lifevault-net

networks:
  lifevault-net:
    driver: bridge
